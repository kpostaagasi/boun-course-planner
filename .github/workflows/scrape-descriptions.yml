name: Scrape course descriptions

# Full description crawl (~2000+ courses). Manual only.
# Re-running after an interruption continues where it left off.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-descriptions
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape course descriptions
        run: node tools/scrape-descriptions.mjs

      - name: Commit descriptions data
        id: commit
        run: |
          if [ -z "$(git status --porcelain public/data/descriptions.json)" ]; then
            echo "No description changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/descriptions.json
            git commit -m "chore(data): update course descriptions from the license catalogue"
            # A crawl can outlast another workflow's push to main; rebase onto
            # the moved tip and retry once. Each workflow owns its own data
            # file, so the rebase cannot conflict.
            git push || (git pull --rebase origin main && git push)
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
