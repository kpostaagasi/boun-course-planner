name: Update course data

# Scrapes registration.boun.edu.tr, commits fresh data, rebuilds the site and
# deploys it to GitHub Pages. Runs daily so a newly published semester shows
# up within 24h without any manual step.
#
# One-time setup: Repository -> Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # daily at 05:00 UTC (08:00 Istanbul)
  workflow_dispatch:
    inputs:
      semester:
        description: 'Force a specific semester, e.g. "2026/2027-1" (empty = auto)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-course-data
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run parser tests
        run: npm test

      # Scraping is skipped for push events: a push to main only rebuilds and
      # redeploys the site (see commit 260c6de). Hitting the university server
      # on every commit would be abusive.
      - name: Scrape course schedules
        id: scrape
        if: github.event_name != 'push'
        env:
          SEMESTER: ${{ inputs.semester }}
        run: |
          if [ -n "$SEMESTER" ]; then
            node tools/scrape.mjs --semester "$SEMESTER"
          else
            node tools/scrape.mjs
          fi

      - name: Scrape academic calendar
        # Best-effort: a calendar site outage must not block the course scrape,
        # but a real layout change should surface in the run log.
        if: github.event_name != 'push'
        run: node tools/scrape-calendar.mjs

      - name: Alert about missing semester dates
        if: github.event_name != 'push' && steps.scrape.outputs.missing_dates != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEYS: ${{ steps.scrape.outputs.missing_dates }}
        run: |
          TITLE="semester-dates.json eksik: $KEYS"
          BODY="Bu dönem(ler) için \`public/data/semester-dates.json\` girişi yok; takvim dışa aktarımı kapalı kalıyor.

          Eklenmesi gereken format (örnek):

          \`\`\`json
          \"$KEYS\": {
            \"start\": \"YYYY-MM-DD\",
            \"end\": \"YYYY-MM-DD\",
            \"holidays\": [{\"date\": \"YYYY-MM-DD\", \"name\": \"Resmi Tatil\"}]
          }
          \`\`\`

          Kaynak: https://akademiktakvim.bogazici.edu.tr"

          gh label create semester-dates --repo ${{ github.repository }} \
            --description "Missing semester-dates.json entries" --color FBCA04 --force 2>/dev/null || true
          OPEN=$(gh issue list --repo ${{ github.repository }} --label semester-dates --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo ${{ github.repository }} --body "$BODY"
          else
            gh issue create --repo ${{ github.repository }} \
              --title "$TITLE" --body "$BODY" --label semester-dates
          fi

      - name: Commit new data
        id: commit
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain public/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "chore(data): update course schedules from registration.boun.edu.tr"
            # A crawl can outlast another workflow's push to main; rebase onto
            # the moved tip and retry once. Each workflow owns its own data
            # file, so the rebase cannot conflict.
            git push || (git pull --rebase origin main && git push)
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        # Deploy on every push and manual run; on the daily cron only when the
        # scrape actually produced new data.
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        run: npm run build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'

      - name: Smoke test deployment
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          FAIL=0

          check() {
            local path="$1"
            for attempt in 1 2 3 4 5; do
              CODE=$(curl -s -o /tmp/smoke-body -w '%{http_code}' "$BASE$path")
              if [ "$CODE" = "200" ]; then
                echo "OK  $path"
                return 0
              fi
              echo "attempt $attempt: $path -> $CODE, retrying in 10s…"
              sleep 10
            done
            echo "FAIL $path (last code $CODE)"
            FAIL=1
          }

          check ""
          for f in public/data/*.json; do
            check "data/$(basename "$f")"
            if [ "$FAIL" = "0" ]; then
              node -e "JSON.parse(require('fs').readFileSync('/tmp/smoke-body','utf8'))" \
                || { echo "FAIL invalid JSON: $f"; FAIL=1; }
            fi
          done

          exit $FAIL

  notify-failure:
    needs: scrape-and-deploy
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or comment on a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Course data update failed (run ${{ github.run_number }})"
          BODY="Automated scrape from registration.boun.edu.tr failed.
          Old data was kept and the deployed site is unchanged.

          Failed run: $RUN_URL"

          OPEN_ISSUE=$(gh issue list --repo ${{ github.repository }} \
            --label automation-failure --state open --json number --jq '.[0].number')

          gh label create automation-failure --repo ${{ github.repository }} \
            --description "Automated scrape/deploy failures" --color D73A4A --force 2>/dev/null || true
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --repo ${{ github.repository }} --body "$BODY"
          else
            gh issue create --repo ${{ github.repository }} \
              --title "$TITLE" --body "$BODY" --label automation-failure
          fi
